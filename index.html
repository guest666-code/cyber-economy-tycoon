<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Economy Tycoon</title>

    <!-- PWA Manifest & Tema Rengi -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff007f">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3817729086327108" crossorigin="anonymous"></script>

    <!-- CSS Stilleri ve Fontlar -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Üst Bilgi ve Aksiyon Butonları -->
    <header class="header">
        <h1>CYBER ECONOMY TYCOON</h1>
        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">ByteCoin:</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">CPS:</span>
                <span id="cps" class="stat-value">0</span>
            </div>
        </div>
        <div class="top-actions">
            <button id="market-btn" class="icon-btn">🛒 Market</button>
            <button id="vip-market-btn" class="icon-btn" style="border-color: #ffcc00; color: #ffcc00;">👑 VIP Market</button>
            <button id="settings-btn" class="icon-btn">⚙️ Ayarlar</button>
            <span id="user-display-name" style="font-size: 0.8rem; color: #ff007f;">Misafir</span>
            <button id="auth-action-btn" class="auth-btn">Giriş Yap</button>
        </div>
    </header>

    <!-- Giriş / Kayıt / Şifremi Unuttum Modalı -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title">GİRİŞ YAP</h2>

            <button id="google-login-btn" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Google ile Hızlı Giriş Yap
            </button>

            <div class="divider"><span>VEYA</span></div>

            <form id="email-auth-form">
                <div class="input-group" id="name-group" style="display: none;">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="auth-name" placeholder="Purpleguy">
                </div>
                <div class="input-group">
                    <label>E-Posta</label>
                    <input type="email" id="auth-email" placeholder="ornek@mail.com" required>
                </div>
                <div class="input-group">
                    <label>Şifre</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submit-auth-btn" class="submit-btn">Giriş Yap</button>
            </form>

            <div class="links-row">
                <a href="#" id="forgot-password-link">Şifremi Unuttum?</a>
                <a href="#" id="toggle-auth-btn">Kayıt Ol</a>
            </div>
        </div>
    </div>

    <!-- Ana Oyun Alanı -->
    <main class="main-container">
        <!-- Sol: 20 Kademeli Yükseltme Paneli -->
        <section class="panel upgrades-panel">
            <h2>Yükseltmeler (20 Adet)</h2>
            <div id="upgrades-list" class="list-container"></div>
        </section>

        <!-- Orta: Tıklama Alanı (Mavi Kutu Engelli) -->
        <section class="clicker-section">
            <button id="clicker-btn" class="cyber-core">
                <span>HACKLE</span>
            </button>
            <p class="hint">Merkeze tıklayarak ByteCoin kas!</p>
        </section>

        <!-- Sağ: VIP ve Mağaza Paneli -->
        <section class="panel store-panel">
            <h2>Gerçek Mağaza (Shopier & VIP)</h2>
            <div id="store-list" class="list-container">
                <div class="upgrade-card" style="flex-direction: column; align-items: flex-start;">
                    <h4 style="color: #ffcc00;">VIP Hacker Lisansı</h4>
                    <p style="font-size: 0.75rem; margin: 4px 0;">500x Tıklama & 250x CPS Gücü!</p>
                    <button class="buy-btn" onclick="buyVipStatus()" style="width: 100%; background: #ffcc00; color: #000;">500.000 Byte ile Al</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Google AdSense Reklam Alanı -->
    <footer class="ad-footer">
        <div class="ad-banner">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3817729086327108"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </footer>

    <!-- Service Worker Kaydı (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker Aktif!', reg))
            .catch(err => console.log('PWA Kayıt Hatası:', err));
        });
      }
    </script>

    <!-- Oyun Motoru -->
    <script type="module" src="game.js"></script>
</body>
</html>
