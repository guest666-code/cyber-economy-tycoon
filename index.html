<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Economy Tycoon</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff007f">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3817729086327108" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <h1>CYBER ECONOMY TYCOON</h1>
        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">ByteCoin:</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">CPS:</span>
                <span id="cps" class="stat-value">0</span>
            </div>
        </div>
        <div class="top-actions">
            <button id="market-open-btn" class="icon-btn">🛒 Market</button>
            <a href="https://www.shopier.com/URUN_LINKINIZ" target="_blank" id="vip-market-open-btn" class="icon-btn" style="border-color: #ffcc00; color: #ffcc00; text-decoration: none; display: inline-flex; align-items: center;">👑 VIP Market</a>
            <button id="settings-open-btn" class="icon-btn">⚙️ Ayarlar</button>
            <span id="user-display-name" style="font-size: 0.8rem; color: #ff007f;">Giriş Yapılmadı</span>
            <button id="auth-action-btn" class="auth-btn">Giriş Yap</button>
        </div>
    </header>

    <!-- Giriş / Kayıt Modal (Zorunlu) -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">GİRİŞ YAP (Zorunlu)</h2>

            <button id="google-login-btn" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Google ile Hızlı Giriş Yap
            </button>

            <div class="divider"><span>VEYA</span></div>

            <form id="email-auth-form">
                <div class="input-group" id="name-group" style="display: none;">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="auth-name" placeholder="Purpleguy">
                </div>
                <div class="input-group">
                    <label>E-Posta</label>
                    <input type="email" id="auth-email" placeholder="ornek@mail.com" required>
                </div>
                <div class="input-group">
                    <label>Şifre</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submit-auth-btn" class="submit-btn">Giriş Yap</button>
            </form>

            <div class="links-row">
                <a href="#" id="forgot-password-link">Şifremi Unuttum?</a>
                <a href="#" id="toggle-auth-btn">Kayıt Ol</a>
            </div>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="close-modal-btn" data-target="settings-modal">&times;</span>
            <h2>⚙️ Oyun Ayarları</h2>
            
            <div class="input-group">
                <label>Dil Seçimi (Language)</label>
                <select id="lang-select">
                    <option value="tr">Türkçe</option>
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="ru">Русский</option>
                </select>
            </div>

            <div class="input-group">
                <label>Renk Teması</label>
                <select id="theme-select">
                    <option value="cyberpunk">Cyberpunk Neon</option>
                    <option value="matrix">Matrix Green</option>
                    <option value="neonRed">Blood Red</option>
                    <option value="electricBlue">Electric Blue</option>
                    <option value="toxicYellow">Toxic Yellow</option>
                    <option value="royalPurple">Royal Purple</option>
                    <option value="sunsetOrange">Sunset Orange</option>
                    <option value="arcticWhite">Arctic White</option>
                    <option value="darkEmerald">Dark Emerald</option>
                    <option value="cyberPink">Cyber Pink</option>
                </select>
            </div>

            <div class="divider"><span>Hesap İşlemleri</span></div>
            <button class="submit-btn" id="change-email-btn" style="margin-bottom: 6px; background: #00aa55;">E-Posta Değiştir</button>
            <button class="submit-btn" id="change-pass-btn" style="margin-bottom: 6px; background: #0055aa;">Şifre Değiştir</button>
            <button class="submit-btn danger" id="delete-acc-btn">Hesabımı Sil</button>
        </div>
    </div>

    <!-- Ana Oyun Alanı -->
    <main class="main-container">
        <section id="upgrades-panel" class="panel upgrades-panel">
            <h2 id="upgrades-panel-title">Yükseltmeler (20 Adet)</h2>
            <div id="upgrades-list" class="list-container"></div>
        </section>

        <section class="clicker-section">
            <button id="clicker-btn" class="cyber-core">
                <span id="clicker-text">HACKLE</span>
            </button>
            <p id="clicker-hint" class="hint">Merkeze tıklayarak ByteCoin kas!</p>
        </section>

        <section class="panel store-panel">
            <h2 id="ad-panel-title">Sponsorlu Reklam</h2>
            <div class="list-container" style="display: flex; justify-content: center; align-items: center;">
                <ins class="adsbygoogle"
                     style="display:inline-block;width:250px;height:250px"
                     data-ad-client="ca-pub-3817729086327108"
                     data-ad-slot="9876543210"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </section>
    </main>

    <footer class="ad-footer">
        <div class="ad-banner">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3817729086327108"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </footer>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
