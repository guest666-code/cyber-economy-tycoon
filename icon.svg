<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Arka Plan -->
  <rect width="512" height="512" rx="100" fill="#0b0b16" />
  
  <!-- Dıştaki Neon Çerçeve -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#cyberGrad)" stroke-width="12" filter="url(#neonGlow)" />
  
  <!-- İç Tasarım / Çip Motifi -->
  <g transform="translate(256, 256) scale(1.2)">
    <!-- Çip Gövdesi -->
    <rect x="-90" y="-90" width="180" height="180" rx="20" fill="#16162c" stroke="#00ffcc" stroke-width="6" />
    
    <!-- Çip Pinleri -->
    <path d="M-120 -50 h30 M-120 0 h30 M-120 50 h30 M90 -50 h30 M90 0 h30 M90 50 h30 M-50 -120 v30 M0 -120 v30 M50 -120 v30 M-50 90 v30 M0 90 v30 M50 90 v30" stroke="#ff007f" stroke-width="8" stroke-linecap="round" />
    
    <!-- Merkez Sembol ($ / Byte) -->
    <text x="0" y="20" font-family="'Orbitron', sans-serif" font-weight="900" font-size="100" fill="#00ffcc" text-anchor="middle" filter="url(#neonGlow)">₿</text>
  </g>
</svg>
