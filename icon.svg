<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arka Plan Neon Gradyanı -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16162c" />
      <stop offset="100%" stop-color="#0b0b16" />
    </radialGradient>

    <!-- Çip Neon Parlama Efekti -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kare -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="#ff007f" stroke-width="8" />

  <!-- Dış Cyber Çember -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00ffcc" stroke-width="6" stroke-dasharray="20 10" opacity="0.8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ff007f" stroke-width="4" opacity="0.6" />

  <!-- Mikroçip / Hack Çekirdeği (Grup) -->
  <g filter="url(#neon-glow)" transform="translate(256, 256)">
    <!-- Çip Ayakları / Pinler -->
    <rect x="-90" y="-120" width="16" height="40" fill="#00ffcc" />
    <rect x="-40" y="-120" width="16" height="40" fill="#00ffcc" />
    <rect x="24" y="-120" width="16" height="40" fill="#00ffcc" />

    <rect x="-90" y="80" width="16" height="40" fill="#00ffcc" />
    <rect x="-40" y="80" width="16" height="40" fill="#00ffcc" />
    <rect x="24" y="80" width="16" height="40" fill="#00ffcc" />

    <rect x="-120" y="-90" width="40" height="16" fill="#ff007f" />
    <rect x="-120" y="-40" width="40" height="16" fill="#ff007f" />
    <rect x="-120" y="24" width="40" height="16" fill="#ff007f" />

    <rect x="80" y="-90" width="40" height="16" fill="#ff007f" />
    <rect x="80" y="-40" width="40" height="16" fill="#ff007f" />
    <rect x="80" y="24" width="40" height="16" fill="#ff007f" />

    <!-- Ana Çip Gövdesi -->
    <rect x="-80" y="-80" width="160" height="160" rx="20" fill="#121223" stroke="#ff007f" stroke-width="8" />

    <!-- İç Çekirdek Matrisi -->
    <rect x="-45" y="-45" width="90" height="90" rx="10" fill="#0b0b16" stroke="#00ffcc" stroke-width="4" />

    <!-- Merkez Kod / Simgesi (Byte / Terminal Çizgileri) -->
    <line x1="-25" y1="-15" x2="5" y2="-15" stroke="#ff007f" stroke-width="6" stroke-linecap="round" />
    <line x1="-25" y1="5" x2="25" y2="5" stroke="#00ffcc" stroke-width="6" stroke-linecap="round" />
    <line x1="-25" y1="25" x2="10" y2="25" stroke="#ffcc00" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
